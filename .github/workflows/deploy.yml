name: Deploy raoof-cars-wp-theme to Hostinger
on:
  push:
    branches: [main]
    paths:
      - 'themes/raoof-cars-wp-theme/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy theme
        run: |
          rsync -avz --delete \
            --exclude 'node_modules/' \
            --exclude '.DS_Store' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./themes/raoof-cars-wp-theme/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}/wp-content/themes/raoof-cars-wp-theme/